[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-jobs"
version = "1.0.0"
description = "CLI tool that fetches active Generative AI, Agentic AI, LLM, and RAG job postings from configured company career portals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "genai-jobs" }]
keywords = ["genai", "agentic-ai", "llm", "rag", "jobs", "cli", "careers"]

dependencies = [
    "ddgs>=1.0.0",
    "typer>=0.12.5",
    "rich>=13.7.1",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "pydantic>=2.9.2",
]

[project.scripts]
genai-jobs = "genai_jobs.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["genai_jobs*"]

[tool.setuptools.package-data]
"genai_jobs" = ["py.typed"]
