[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-jobs"
version = "1.0.0"
description = "CLI tool that fetches active Generative AI, AI Engineering, and Agentic AI job postings from configured target companies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "genai-jobs" }]
keywords = ["genai", "jobs", "cli", "llm", "careers"]

dependencies = [
    "python-jobspy>=1.1.80",
    "ddgs>=1.0.0",
    "duckduckgo-search>=6.3.0",
    "typer>=0.12.5",
    "rich>=13.7.1",
    "httpx>=0.27.2",
    "pandas>=2.2.3",
    "tenacity>=9.0.0",
    "pydantic>=2.9.2",
]

[project.scripts]
genai-jobs = "genai_jobs.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["genai_jobs*"]

[tool.setuptools.package-data]
"genai_jobs" = ["py.typed"]
